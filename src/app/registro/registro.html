<section class="card">
  <header class="card__head">
    <span class="badge">Nuevo usuario</span>
    <h1>Registro de usuario</h1>
    <p class="subtitle">Completa tus datos para crear tu cuenta.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="field">
      <label for="nombre">Nombre</label>
      <input
        id="nombre"
        type="text"
        formControlName="nombre"
        placeholder="Ej. Ana Torres"
        autocomplete="name"
      />
    </div>

    <div class="field">
      <label for="correo">Correo</label>
      <input
        id="correo"
        type="email"
        formControlName="correo"
        placeholder="tucorreo@ejemplo.com"
        autocomplete="email"
      />
    </div>

    <div class="field">
      <label for="edad">Edad</label>
      <input id="edad" type="number" formControlName="edad" placeholder="18" min="18" />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Mínimo 8 caracteres"
        autocomplete="new-password"
      />
    </div>

    <button type="submit">Registrar</button>
  </form>

  @if (enviado) {
    <p class="success" role="status">¡Usuario registrado correctamente!</p>
  }
</section>
